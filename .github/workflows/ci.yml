name: CI
on: [push, pull_request]
jobs:
  validate-intent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/pre-implement.test.sh

  ios-unit-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          xcodebuild test \
            -project NoiseSignal.xcodeproj \
            -scheme NoiseSignal \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO
